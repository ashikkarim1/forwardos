<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forward OS - M&A Intelligence Platform</title>
  <link rel="icon" href="/FOS.jpg" type="image/jpeg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: white; }
    header { border-bottom: 1px solid #E5E4E0; padding: 20px; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    nav { display: flex; gap: 20px; }
    nav a { color: #1A1A1A; text-decoration: none; }
    main { min-height: 80vh; padding: 80px 20px; text-align: center; }
    .content { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 48px; font-weight: bold; margin-bottom: 20px; }
    p { font-size: 18px; color: #666; margin-bottom: 40px; }
    .buttons { display: flex; gap: 20px; justify-content: center; margin-bottom: 60px; flex-wrap: wrap; }
    a.btn { padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 16px; text-decoration: none; }
    a.btn-primary { background: #2D7A5F; color: white; }
    a.btn-secondary { border: 2px solid #2D7A5F; color: #2D7A5F; background: white; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div style="font-size: 24px; font-weight: bold;">Forward OS</div>
      <nav>
        <a href="/marketplace">Marketplace</a>
        <a href="/deals">Deals</a>
        <a href="/help">Help</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="content">
      <h1>M&A Intelligence Platform</h1>
      <p>✅ Forward OS is online</p>
      <div class="buttons">
        <a href="/marketplace" class="btn btn-primary">Marketplace</a>
        <a href="/deals" class="btn btn-secondary">Deals</a>
      </div>
    </div>
  </main>
</body>
</html>
