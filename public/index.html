<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forward OS - M&A Intelligence Platform</title>
  <link rel="icon" href="/FOS.jpg" type="image/jpeg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: white; }
    header { border-bottom: 1px solid #E5E4E0; padding: 20px; background: white; }
    .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 24px; font-weight: bold; color: #1A1A1A; }
    nav { display: flex; gap: 20px; }
    nav a { color: #1A1A1A; text-decoration: none; }
    main { min-height: calc(100vh - 200px); padding: 80px 20px; text-align: center; background: white; }
    .content { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 48px; font-weight: bold; margin-bottom: 20px; color: #1A1A1A; }
    p { font-size: 20px; color: #717171; margin-bottom: 40px; }
    .buttons { display: flex; gap: 20px; justify-content: center; margin-bottom: 60px; }
    a.btn { padding: 15px 40px; border-radius: 8px; font-weight: bold; font-size: 16px; text-decoration: none; }
    a.btn-primary { background: #FF8C00; color: white; }
    a.btn-secondary { border: 2px solid #FF8C00; color: #FF8C00; background: white; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; margin-top: 60px; padding-top: 60px; border-top: 1px solid #E5E4E0; }
    .stat-item .number { font-size: 32px; font-weight: bold; color: #FF8C00; }
    .stat-item .label { color: #717171; }
    footer { border-top: 1px solid #E5E4E0; padding: 40px 20px; text-align: center; color: #717171; }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">Forward OS</div>
      <nav>
        <a href="/marketplace">Marketplace</a>
        <a href="/deals">Deals</a>
        <a href="/help">Help</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="content">
      <h1>M&A Intelligence Platform</h1>
      <p style="font-size: 18px; color: #666;">Production Database Connected ✅</p>

      <div class="buttons">
        <a href="/marketplace" class="btn btn-primary">Marketplace</a>
        <a href="/deals" class="btn btn-secondary">Deals</a>
      </div>

      <div class="stats">
        <div class="stat-item">
          <div class="number">29</div>
          <div class="label">Businesses</div>
        </div>
        <div class="stat-item">
          <div class="number">$10.5B</div>
          <div class="label">Valuation</div>
        </div>
        <div class="stat-item">
          <div class="number">12</div>
          <div class="label">Industries</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Forward OS. The M&A operating system.</p>
  </footer>
</body>
</html>
