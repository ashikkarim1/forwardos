# Notifications weekly digest — Mondays 7:00 UTC.
#
# Drains the buffer with forceCadence='WEEKLY' so any users on the
# weekly tier (default for FREE) get their Monday morning roll-up.
# See src/lib/notifications/send-window.ts.
name: cron · notifications-weekly

on:
  schedule:
    - cron: "0 7 * * 1"   # Mon 07:00 UTC
  workflow_dispatch:

concurrency:
  group: cron-notifications-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hit notifications-weekly endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://www.forwardos.ai' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set in this repo."
            exit 1
          fi
          response=$(curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${SITE_URL}/api/cron/notifications-weekly")
          echo "$response"
          echo "$response" | grep -q '"ok":true' || {
            echo "::error::Endpoint returned non-ok payload"
            exit 1
          }
